x-xelqun-build: &xelqun-build
    context: .
    dockerfile: Dockerfile
    args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Xelqun}

x-xelqun-runtime: &xelqun-runtime
    APP_NAME: ${APP_NAME:-Xelqun}
    APP_ENV: ${APP_ENV:-production}
    APP_KEY: ${APP_KEY:?APP_KEY is required}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL:?APP_URL is required}
    XELQUN_SITE_DOMAIN: ${XELQUN_SITE_DOMAIN:?XELQUN_SITE_DOMAIN is required}
    XELQUN_DEMO_DOMAIN: ${XELQUN_DEMO_DOMAIN:?XELQUN_DEMO_DOMAIN is required}
    LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_CONNECTION: sqlite
    DB_DATABASE: /var/www/html/storage/database.sqlite
    SESSION_DRIVER: database
    SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
    CACHE_STORE: database
    QUEUE_CONNECTION: sync
    MAIL_MAILER: log
    PHP_CLI_SERVER_WORKERS: ${PHP_CLI_SERVER_WORKERS:-4}

services:
    app:
        build: *xelqun-build
        restart: unless-stopped
        environment: *xelqun-runtime
        expose:
            - '8000'
        volumes:
            - storage:/var/www/html/storage
        command: >-
            sh -lc "touch storage/database.sqlite && php artisan migrate --force && php artisan demo:reset && php artisan optimize && exec php artisan serve --host=0.0.0.0 --port=8000"
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -q -O /dev/null http://127.0.0.1:8000/up || exit 1',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    scheduler:
        build: *xelqun-build
        restart: unless-stopped
        environment: *xelqun-runtime
        depends_on:
            app:
                condition: service_healthy
        volumes:
            - storage:/var/www/html/storage
        command: php artisan schedule:work

volumes:
    storage:
